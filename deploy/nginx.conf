# ============================================================================
#  Company Drive — Nginx site config
#  Place at: /etc/nginx/sites-available/company-drive
#  Then:  sudo ln -s /etc/nginx/sites-available/company-drive /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
#  - Serves the built SPA from client/dist
#  - Proxies /api to the Node backend on 127.0.0.1:5000
#  - The storage directory is NEVER served by Nginx (files go through /api only)
#  - Large uploads (up to 10 GB) and long proxy timeouts are configured
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # certbot will add the 443 server block + redirect automatically.

    # --- Built frontend (static SPA) ---
    root /var/www/company-drive/client/dist;
    index index.html;

    # SPA history fallback: every non-file route returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- API reverse proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- Large file uploads (up to 10 GB) ---
        client_max_body_size      10g;
        proxy_request_buffering   off;   # stream the body straight to Node
        proxy_buffering           off;   # stream responses (downloads/preview)

        # --- Generous timeouts for big transfers ---
        proxy_connect_timeout     60s;
        proxy_send_timeout        3600s;
        proxy_read_timeout        3600s;
        send_timeout              3600s;
    }

    # Hard-deny any attempt to reach the storage dir via the web root.
    # Block direct access to the storage path. Use a PREFIX match (not a regex
    # `~ /storage/`) so it only catches URLs that START with /storage/ and does
    # NOT accidentally swallow API routes like /api/storage/quota.
    location /storage/ {
        deny all;
        return 404;
    }
}
